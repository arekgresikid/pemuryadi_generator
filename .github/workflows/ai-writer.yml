name: AI Blog Writer

on:
  schedule:
    # Berjalan seminggu sekali setiap hari Rabu pukul 08:00 WIB (Cron: 0 1 * * 3)
    - cron: '0 1 * * 3'
  workflow_dispatch: # Memungkinkan eksekusi manual dari tab Actions

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dibutuhkan untuk git commit
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate Blog Content via AI
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: npm run generate-blog

      - name: Commit Generated File to Repo
        run: |
          git config --global user.name "AI Blog Writer"
          git config --global user.email "actions@github.com"
          git add content/blog/*.md
          git commit -m "chore: auto-generate blog post via AI" || echo "Tidak ada perubahan"
          git push origin main || echo "Gagal melakukan push"

      - name: Upload new articles to Dashboard
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          API_URL: ${{ vars.API_URL }}
        run: |
          URL="${API_URL:-https://digen.id}"
          # Gunakan file-file yang ada di dalam content/blog/ (upload-blog script juga akan memprosesnya)
          for file in content/blog/*.md; do
            if [ -f "$file" ]; then
              # Mengambil judul dan membersihkan karakter #
              title=$(head -n 1 "$file" | sed 's/^# *//')
              content=$(cat "$file")
              
              json=$(jq -n --arg t "$title" --arg c "$content" '{title: $t, content: $c}')
              
              echo "Mengunggah hasil AI ke Dashboard: $title"
              curl -X POST "$URL/api/blog/github-upload?secret=$POLLINATIONS_API_KEY" \
                -H "Content-Type: application/json" \
                -d "$json"
              echo ""
            fi
          done
